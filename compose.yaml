# Example deployment. Copy, adjust the paths and URLs, then `docker compose up -d`.
services:
  keeper:
    image: ghcr.io/arlab1/aurral-keeper-for-plexamp:latest
    container_name: aurral-keeper-for-plexamp
    restart: unless-stopped
    ports:
      - "30074:3010"
    environment:
      PLEX_URL: "http://plex:32400"
      AURRAL_URL: "http://aurral:3000"
      SOURCE_LIBRARY: "Aurral"
      MIN_RATING: "10"
      # Secrets are read from files so they stay out of the container config.
      PLEX_TOKEN_FILE: "/run/keeper-secrets/plex_token"
      AURRAL_API_KEY_FILE: "/run/keeper-secrets/aurral_api_key"
      WEBHOOK_SECRET_FILE: "/run/keeper-secrets/webhook_secret"
    volumes:
      - ./secrets:/run/keeper-secrets:ro
    # The bridge holds no state and writes nothing.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
